[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "munet-nn"
version = "0.3.0"
description = "Experimental C++ graph compiler for portable Vulkan training and inference"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "MuNet Contributors" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/bryan-pakulski/MuNet"
Repository = "https://github.com/bryan-pakulski/MuNet"

[project.scripts]
munet-node = "munet.cli:node"
munet-server = "munet.swarm.__main__:main"

[project.optional-dependencies]
interop = ["onnx>=1.16"]
vk = ["onnx>=1.16", "onnxruntime>=1.18"]
test = ["pytest>=8", "onnx>=1.16", "onnxruntime>=1.18", "scipy>=1.10"]
torch = ["torch>=2.6", "onnx>=1.16", "onnxscript>=0.3"]

[tool.scikit-build]
wheel.packages = ["python/munet", "python/munet_nn"]
cmake.build-type = "Release"
cmake.define.MUNET_SWARM_NODE = "ON"
cmake.define.MUNET_INSTALL_SDK = "OFF"
sdist.include = [
  "Makefile", "conftest.py", "cpp/**", "cmake/**", "tools/*.py", "tests/*.py", "tests/*.json", "docs/**",
  "examples/**/*.py", "examples/**/*.md", "examples/**/*.txt", "examples/**/*.json",
  "examples/**/LICENSE*", "examples/**/NOTICE",
]
sdist.exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.cibuildwheel]
build = "cp310-manylinux_* cp311-manylinux_* cp312-manylinux_* cp313-manylinux_* cp314-manylinux_*"
skip = "*-musllinux_*"
test-command = "python {project}/tools/smoke_install.py"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.pytest.ini_options]
testpaths = ["tests"]
