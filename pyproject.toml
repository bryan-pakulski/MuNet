[build-system]
requires = [
  "scikit-build-core>=0.10",
  "pybind11>=2.11",
]
build-backend = "scikit_build_core.build"

[project]
name = "munet-nn"
version = "0.1.2"
description = "MuNet: lightweight C++ tensor/autograd framework with Python bindings"
readme = "ReadMe.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "MuNet Contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/bryan-pakulski/MuNet"
Repository = "https://github.com/bryan-pakulski/MuNet"
Source = "https://github.com/bryan-pakulski/MuNet"

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.18"
cmake.build-type = "Release"
install.strip = true
cmake.args = [
  "-DMUNET_BUILD_TESTS=OFF",
  "-DMUNET_BUILD_TOOLS=OFF",
]
wheel.packages = ["python/munet_nn"]

[tool.cibuildwheel]
build = "cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64"
skip = "cp3?-* pp* *-musllinux_* *-manylinux_i686"
archs = ["x86_64"]
build-verbosity = 1
test-command = "python -c \"import munet_nn as munet; status = munet.backend_status(); backends = munet.list_available_backends(); assert isinstance(status, dict) and 'statuses' in status; assert isinstance(backends, list); assert all(name == 'vulkan' for name in backends); print(munet.__doc__ is not None)\""

[tool.cibuildwheel.linux]
before-all = "dnf -y install vulkan-devel vulkan-tools glslang-tools || dnf -y install vulkan-devel vulkan-tools"
environment = { CMAKE_ARGS = "-DVulkan_INCLUDE_DIR=/usr/include -DVulkan_LIBRARY=/lib64/libvulkan.so.1" }
