# Keep this path: the existing munet-nn PyPI trusted publisher is bound to it.
name: Wheels

on:
  push:
    branches: [master]
    tags: ["v*", "dev*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Validate package and release identity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install packaging
      - run: python tools/release_version.py

  correctness:
    needs: version
    uses: ./.github/workflows/ci.yml

  build_wheels:
    name: Wheels (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Build and exercise installed CPU/Vulkan wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_BEFORE_ALL_LINUX: dnf -y install vulkan-headers libcurl-devel openssl-devel
          # A single runtime per Python/platform avoids colliding CPU/GPU filenames.
          CIBW_ENVIRONMENT_LINUX: >-
            CMAKE_ARGS="-DMUNET_VULKAN=ON -DMUNET_SWARM_NODE=ON -DMUNET_INSTALL_SDK=OFF"
          # libvulkan is loaded lazily from the host. auditwheel repairs the native
          # worker and extension, including their libcurl/OpenSSL dependencies.
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  source:
    name: Source distribution
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build --sdist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: source-dist
          path: dist/*.tar.gz
          if-no-files-found: error

  native:
    name: Node, server and SDK (${{ matrix.arch }})
    needs: build_wheels
    runs-on: ${{ matrix.runner }}
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: wheelhouse
      - name: Install packaging tools and the actual CPython 3.12 wheel
        shell: bash
        run: |
          dnf -y install vulkan-headers
          /opt/python/cp312-cp312/bin/python -m pip install cmake pyinstaller==6.22.2 packaging
          /opt/python/cp312-cp312/bin/python -m pip install wheelhouse/*cp312-cp312-*.whl
      - name: Freeze server, package native node and SDK, and exercise all three
        shell: bash
        run: |
          /opt/python/cp312-cp312/bin/python tools/build_release.py --wheel wheelhouse/*cp312-cp312-*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-${{ matrix.arch }}
          path: release-dist/*
          if-no-files-found: error

  validate_wheels:
    name: Validate all distributions
    needs: [build_wheels, source, native, correctness]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: incoming
      - uses: actions/download-artifact@v4
        with:
          name: source-dist
          path: incoming/source
      - run: python -m pip install packaging twine
      - run: python tools/validate_artifacts.py incoming
      - name: Collect validated, uniquely named Python distributions
        shell: python
        run: |
          from pathlib import Path
          import shutil, subprocess, sys
          target = Path('dist')
          target.mkdir()
          for p in Path('incoming').rglob('*'):
              if p.is_file() and (p.name.endswith('.whl') or p.name.endswith('.tar.gz')):
                  assert not (target / p.name).exists(), p.name
                  shutil.copyfile(p, target / p.name)
          subprocess.run([sys.executable, '-m', 'twine', 'check', *map(str, target.iterdir())], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*

  publish_testpypi:
    name: Publish dev wheels to TestPyPI
    needs: validate_wheels
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/dev')
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

  publish:
    name: Publish release wheels to PyPI
    needs: validate_wheels
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  release:
    name: Publish standalone downloads
    needs: [validate_wheels, publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-linux-*
          path: release-dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: release-dist
      - name: Detect prerelease version
        id: version
        shell: python
        run: |
          import os, re
          tag = os.environ['GITHUB_REF_NAME']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('prerelease=' + str(bool(re.search(r'(?:a|b|rc)\d', tag))).lower() + '\n')
      - uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease }}
