name: Vulkan Wheels

on:
  push:
    branches: [main]
    tags: ["v*", "dev*"]
  pull_request:
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build Vulkan wheels
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Vulkan wheels
        uses: pypa/cibuildwheel@v2.20.0
        env:
          CIBW_BUILD: cp310-* cp311-* cp312-*
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_28_x86_64
          CIBW_ENVIRONMENT_LINUX: >-
            CMAKE_ARGS="-DVulkan_INCLUDE_DIR=/usr/include -DVulkan_LIBRARY=/lib64/libvulkan.so.1"
          CIBW_BEFORE_ALL_LINUX: |
            set -euxo pipefail
            dnf -y install vulkan-devel vulkan-tools
            dnf -y install glslang-tools || true
            dnf -y install shaderc-devel || true
            dnf -y install shaderc || true
            vulkaninfo --summary || true
            glslc --version || true

      - name: Upload Vulkan wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-vulkan
          path: wheelhouse/*.whl

  validate_wheels:
    name: Validate Vulkan wheel artifacts
    needs: build_wheels
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download Vulkan wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-vulkan

      - name: Flatten wheel artifacts
        run: |
          mkdir -p wheelhouse
          find dist -name "*.whl" -exec cp {} wheelhouse/ \;

      - name: Twine and metadata validation
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip twine
          twine check wheelhouse/*.whl

      - name: Assert Vulkan wheel package tree
        run: |
          set -euxo pipefail
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheels = sorted(Path("wheelhouse").glob("*.whl"))
          if not wheels:
              raise SystemExit("No wheels found under wheelhouse/")

          for wheel in wheels:
              with zipfile.ZipFile(wheel) as zf:
                  names = set(zf.namelist())
              required = ["munet_nn/__init__.py"]
              for required_path in required:
                  if required_path not in names:
                      raise SystemExit(f"{wheel.name} missing required artifact: {required_path}")
              if not any(name.startswith("munet_nn/_core") for name in names):
                  raise SystemExit(f"{wheel.name} missing munet_nn/_core extension")
              if any(name.startswith("munet_nn/_helpers/") for name in names):
                  raise SystemExit(f"{wheel.name} still contains removed helper modules")
          print("Vulkan wheel package tree validation passed")
          PY

      - name: Dry-run clean-venv install smoke
        run: |
          set -euxo pipefail
          python -m venv .venv-wheel-check
          . .venv-wheel-check/bin/activate
          python -m pip install --upgrade pip
          python -m pip install --no-deps --no-index --find-links=wheelhouse munet-nn
          python - <<'PY'
          import munet_nn as munet

          status = munet.backend_status()
          backends = munet.list_available_backends()
          assert isinstance(status, dict) and "statuses" in status
          assert isinstance(backends, list)
          assert all(name == "vulkan" for name in backends)
          print("Vulkan import/probe smoke passed")
          PY

  publish_testpypi:
    name: Publish dev Vulkan wheels to TestPyPI
    needs: validate_wheels
    if: startsWith(github.ref, 'refs/tags/dev')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download Vulkan wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-vulkan

      - name: Flatten wheel artifacts
        run: |
          mkdir -p wheelhouse
          find dist -name "*.whl" -exec cp {} wheelhouse/ \;

      - name: Check wheel file sizes
        run: |
          set -euxo pipefail
          ls -lh wheelhouse/*.whl
          python - <<'PY'
          from pathlib import Path
          limit = 100 * 1024 * 1024
          too_large = []
          for wheel in Path("wheelhouse").glob("*.whl"):
            size = wheel.stat().st_size
            print(f"{wheel.name}: {size / (1024 * 1024):.1f} MB")
            if size > limit:
              too_large.append((wheel.name, size))
          if too_large:
            names = ", ".join(name for name, _ in too_large)
            raise SystemExit(
              "Wheel exceeds TestPyPI/PyPI default 100 MB file limit: "
              f"{names}. See https://docs.pypi.org/project-management/storage-limits/"
            )
          PY

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse/
          repository-url: https://test.pypi.org/legacy/
          verbose: true

  publish:
    name: Publish release Vulkan wheels to PyPI
    needs: validate_wheels
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download Vulkan wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-vulkan

      - name: Flatten wheel artifacts
        run: |
          mkdir -p wheelhouse
          find dist -name "*.whl" -exec cp {} wheelhouse/ \;

      - name: Check wheel file sizes
        run: |
          set -euxo pipefail
          ls -lh wheelhouse/*.whl
          python - <<'PY'
          from pathlib import Path
          limit = 100 * 1024 * 1024
          too_large = []
          for wheel in Path("wheelhouse").glob("*.whl"):
            size = wheel.stat().st_size
            print(f"{wheel.name}: {size / (1024 * 1024):.1f} MB")
            if size > limit:
              too_large.append((wheel.name, size))
          if too_large:
            names = ", ".join(name for name, _ in too_large)
            raise SystemExit(
              "Wheel exceeds TestPyPI/PyPI default 100 MB file limit: "
              f"{names}. See https://docs.pypi.org/project-management/storage-limits/"
            )
          PY

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse/
          verbose: true
